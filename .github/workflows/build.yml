name: Python package

on: [ push, pull_request ]

env:
  A2L_GRPC_VERSION: v0.3.0

jobs:
  generate-grpc-sources:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # the generated sources are distributed with the package, and the protobuf runtime refuses to load sources
          # generated by a more recent version of itself. As protobuf 7.x requires Python 3.10 or newer, the sources
          # must be generated with the 6.x code generator to remain loadable on the oldest supported Python version.
          # This constraint can be dropped as soon as Python 3.9 is not supported anymore.
          pip install "grpcio-tools>=1.71.0,<1.81"
          wget https://github.com/Sauci/a2l-grpc/releases/download/$A2L_GRPC_VERSION/a2l_grpc.tar.gz
          tar -xf a2l_grpc.tar.gz -C pya2l
      - name: Generate gRPC sources
        run: |
          python -m grpc_tools.protoc -I./pya2l/a2l_grpc --python_out=pya2l --pyi_out=pya2l --grpc_python_out=pya2l ./pya2l/a2l_grpc/protobuf/*.proto
      - uses: actions/upload-artifact@v7
        with:
          name: protobuf
          path: pya2l/protobuf
  run-pytest-test:
    runs-on: ${{ matrix.target.runner }}
    needs:
      - generate-grpc-sources
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # one entry per shared object shipped by the a2l-grpc release, except for the linux/386 and linux/arm targets,
        # for which no runner is available.
        target:
          - { name: linux_amd64, runner: ubuntu-22.04, architecture: x64 }
          - { name: linux_arm64, runner: ubuntu-22.04-arm, architecture: arm64 }
          - { name: windows_amd64, runner: windows-2022, architecture: x64 }
          - { name: windows_386, runner: windows-2022, architecture: x86 }
          # the x64 interpreter is used on the windows/arm64 runner on purpose: grpcio publishes no windows/arm64
          # wheel (see https://github.com/grpc/grpc/issues/39064) and its source build is currently broken on that
          # platform (see https://github.com/grpc/grpc/issues/23310). the x64 interpreter runs under emulation, and
          # therefore loads the windows/amd64 shared object. this can be switched back to arm64 as soon as a
          # windows/arm64 grpcio wheel is published.
          - { name: windows_arm64, runner: windows-11-arm, architecture: x64 }
          - { name: darwin_arm64, runner: macos-15, architecture: arm64 }
          - { name: darwin_amd64, runner: macos-15-intel, architecture: x64 }
        python-version: ['3.13', '3.12', '3.11', '3.10', '3.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target.architecture }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest 9 is not supported by pytest-cases, see https://github.com/pytest-dev/pytest/issues/11868
          pip install codecov dictdiffer "grpcio-tools>=1.71.0" mktestdocs mock "pytest<9" pytest-cases pytest-cov pytest-xdist
          curl -sSfL -o a2l_grpc.tar.gz https://github.com/Sauci/a2l-grpc/releases/download/$A2L_GRPC_VERSION/a2l_grpc.tar.gz
          tar -xf a2l_grpc.tar.gz -C pya2l
      - uses: actions/download-artifact@v8
        with:
          name: protobuf
          path: pya2l/protobuf
      - name: Test with pytest
        run: |
          pytest -n 1 --cov-report html --cov pya2l --verbose
          codecov
  build-distribution:
    runs-on: ubuntu-22.04
    needs:
      - run-pytest-test
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          wget https://github.com/Sauci/a2l-grpc/releases/download/$A2L_GRPC_VERSION/a2l_grpc.tar.gz
          tar -xf a2l_grpc.tar.gz -C pya2l
      - uses: actions/download-artifact@v8
        with:
          name: protobuf
          path: pya2l/protobuf
      - run: |
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
  publish-package:
    runs-on: ubuntu-22.04
    needs:
      - build-distribution
    environment:
      name: pypi
      url: https://pypi.org/p/pya2l
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish package on Python Package Index
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
  test-pip-package:
    runs-on: ${{ matrix.target.runner }}
    needs:
      - publish-package
    # this job installs the package published on the Python package index, which is only updated when a tag is pushed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux_amd64, runner: ubuntu-22.04, architecture: x64 }
          - { name: linux_arm64, runner: ubuntu-22.04-arm, architecture: arm64 }
          - { name: windows_amd64, runner: windows-2022, architecture: x64 }
          - { name: windows_386, runner: windows-2022, architecture: x86 }
          # see the comment in the run-pytest-test job about the interpreter architecture used on this runner.
          - { name: windows_arm64, runner: windows-11-arm, architecture: x64 }
          - { name: darwin_arm64, runner: macos-15, architecture: arm64 }
          - { name: darwin_amd64, runner: macos-15-intel, architecture: x64 }
        python-version: ['3.13', '3.12', '3.11', '3.10', '3.9']
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target.architecture }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # the version matching the tag is requested explicitly, and the installation is retried until the package
          # index serves it: it takes a few tens of seconds for a freshly published release to become available, during
          # which pip would otherwise silently install the previously released version. the cache is disabled because
          # the package index declares its responses as valid for ten minutes, which makes pip answer the retries below
          # with the outdated response it cached on the first attempt.
          version=${GITHUB_REF_NAME#v}
          attempt=0
          until pip install --no-cache-dir "pya2l==$version"; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 12 ]; then
              echo "pya2l $version is not available on the package index"
              exit 1
            fi
            sleep 10
          done
          pip show pya2l | grep "^Version: $version$"
          echo "/begin PROJECT _ \"\" /begin MODULE _ \"\" /end MODULE /end PROJECT" > test.a2l
          pya2l test.a2l to_json
          pya2l test.a2l to_json -o test.json

